<h1>CLI</h1>
<p>Single-file native compilation is implemented.</p>
<pre><code>strut hello.p
strut hello.p -o hello
strut --check hello.p
strut --dump-tokens hello.p</code></pre>
<p>The output defaults to the source stem (<code>.exe</code> on Windows). Project commands such as <code>strut make</code> and <code>strut test</code> remain planned rather than implemented.</p>
