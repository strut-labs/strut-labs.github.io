<h1>Types</h1><p>Default numeric names are aliases rather than privileged compiler-only spellings.</p><pre><code>type int := int_32;
type uint := uint_32;
type double := double_32;</code></pre><p>Explicit widths include <code>int_8</code> through <code>int_64</code>, unsigned equivalents, and <code>double_32</code>/<code>double_64</code>.</p><p>Dynamic arrays use <code>T[]</code>; fixed arrays use <code>T[n]</code>.</p>
