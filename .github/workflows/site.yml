name: Website source certification

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Checkout generated site
        uses: actions/checkout@v5
        with:
          ref: main
          path: public
      - name: Validate pages, links, sitemap, and agent indexes
        run: python3 check_site.py
